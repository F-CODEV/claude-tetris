<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tetris</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <button id="theme-toggle" type="button" aria-label="Cambiar a tema claro" aria-pressed="false" title="Tema claro/oscuro"></button>

  <h1 class="title">TETRIS</h1>

  <div class="wrapper">
    <div class="game-container">
      <aside class="panel panel-left hidden" id="abilities-panel">
        <div class="panel-section">
          <span class="label">ENERGÍA <kbd>E</kbd></span>
          <div class="energy-bar" id="energy-bar"><div class="energy-fill" id="energy-fill"></div></div>
        </div>
        <div class="panel-section">
          <span class="label">HOLD</span>
          <canvas id="hold-canvas" width="80" height="80"></canvas>
        </div>
        <div class="panel-section hidden" id="preview-section">
          <span class="label">PRÓXIMAS</span>
          <canvas id="preview-canvas" width="160" height="32"></canvas>
        </div>
      </aside>

      <canvas id="board" width="300" height="600"></canvas>

      <aside class="panel">
        <div class="panel-section">
          <span class="label">SCORE</span>
          <span class="value" id="score">0</span>
        </div>
        <div class="panel-section">
          <span class="label">LINES</span>
          <span class="value" id="lines">0</span>
        </div>
        <div class="panel-section">
          <span class="label">LEVEL</span>
          <span class="value" id="level">1</span>
        </div>
        <div class="panel-section">
          <span class="label">COMBO</span>
          <span class="value" id="combo">—</span>
        </div>
        <div class="panel-section hidden" id="goal-section">
          <span class="label">OBJETIVO</span>
          <span class="goal" id="goal"></span>
        </div>

        <div class="panel-section">
          <span class="label">NEXT</span>
          <canvas id="next-canvas" width="120" height="120"></canvas>
        </div>

        <div class="panel-section controls">
          <span class="label">CONTROLS</span>
          <ul>
            <li><kbd>←</kbd><kbd>→</kbd> mover</li>
            <li><kbd>↑</kbd> rotar</li>
            <li><kbd>↓</kbd> bajar</li>
            <li><kbd>Space</kbd> caída</li>
            <li><kbd>E</kbd> habilidad</li>
            <li><kbd>P</kbd> pausa</li>
            <li><kbd>M</kbd> sonido</li>
          </ul>
        </div>
      </aside>
    </div>

    <div id="overlay" class="overlay hidden">
      <div class="overlay-box">
        <p id="overlay-title">GAME OVER</p>
        <p id="overlay-score"></p>
        <div id="mode-list" class="mode-list hidden"></div>
        <div id="ability-list" class="mode-list hidden"></div>
        <div id="overlay-actions" class="overlay-actions hidden">
          <button id="restart-btn">Reiniciar</button>
          <button id="menu-btn" class="secondary-btn" type="button">Menú</button>
        </div>
      </div>
    </div>
  </div>

  <script src="game.js"></script>
</body>
</html>
